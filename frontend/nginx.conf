server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to backend so frontend works without build-time VITE_API_BASE_URL.
  location /api/ {
    proxy_pass https://alma-ai.up.railway.app/api/;
    proxy_http_version 1.1;
    proxy_set_header Host alma-ai.up.railway.app;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
